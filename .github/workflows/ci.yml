name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only is sufficient; nothing here needs write access.
permissions:
  contents: read

jobs:
  ci:
    name: build, test, lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          # Tracks the `go` directive in go.mod, so this needs no manual bumping.
          go-version-file: go.mod
          cache: true

      - name: Verify go.mod is tidy
        run: |
          # Fails if go.mod/go.sum need updating, so drift cannot land unnoticed.
          go mod tidy -diff

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Format check
        run: |
          test -z "$(gofmt -l .)" || {
            echo "These files need gofmt:"
            gofmt -l .
            exit 1
          }

      - name: Test
        run: go test -race -count=1 -coverprofile=coverage.out ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: warn
